name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment alvo
        required: true
        type: string
      namespace:
        description: Namespace Kubernetes do ambiente
        required: true
        type: string
      image_ref:
        description: Imagem completa a ser implantada
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} (${{ inputs.namespace }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      APP_DB_URL: ${{ vars.APP_DB_URL }}
      APP_DB_USER: ${{ vars.APP_DB_USER || 'oficina_admin' }}
      SERVERLESS_JWT_ISSUER: ${{ vars.SERVERLESS_JWT_ISSUER || 'oficina-auth-serverless' }}
      SERVERLESS_JWT_AUDIENCE: ${{ vars.SERVERLESS_JWT_AUDIENCE || 'oficina-backend' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment configuration
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_SESSION_TOKEN" ] || [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Credenciais temporárias AWS ou EKS_CLUSTER_NAME ausentes; deploy ignorado."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Academy credentials
        if: steps.check.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS session
        if: steps.check.outputs.configured == 'true'
        run: aws sts get-caller-identity

      - name: Setup kubectl
        if: steps.check.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'

      - name: Configure cluster access
        if: steps.check.outputs.configured == 'true'
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl cluster-info

      - name: Render application manifests
        if: steps.check.outputs.configured == 'true'
        env:
          TARGET_NS: ${{ inputs.namespace }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          rm -rf rendered
          mkdir -p rendered
          cp k8s/namespace.yaml k8s/app-deployment.yaml k8s/app-service.yaml k8s/hpa.yaml rendered/
          sed -i "s|name: oficina$|name: ${TARGET_NS}|" rendered/namespace.yaml
          sed -i "s|namespace: oficina$|namespace: ${TARGET_NS}|" rendered/*.yaml
          sed -i "s|image: oficina-backend:latest|image: ${IMAGE_REF}|" rendered/app-deployment.yaml
          kubectl apply -f rendered/namespace.yaml

      - name: Provision application configuration
        if: steps.check.outputs.configured == 'true'
        env:
          TARGET_NS: ${{ inputs.namespace }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_SERVERLESS_JWT_PUBLIC_KEY: ${{ secrets.SERVERLESS_JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_DB_URL" ] || [ -z "$APP_DB_USER" ]; then
            echo "::error::Configure APP_DB_URL e APP_DB_USER no GitHub Environment."
            exit 1
          fi
          if [ -z "$APP_DB_PASSWORD" ] || [ -z "$APP_JWT_SECRET" ] || [ -z "$APP_ADMIN_PASSWORD" ] || [ -z "$APP_SERVERLESS_JWT_PUBLIC_KEY" ]; then
            echo "::error::Configure APP_DB_PASSWORD, APP_JWT_SECRET, APP_ADMIN_PASSWORD e SERVERLESS_JWT_PUBLIC_KEY no GitHub Environment."
            exit 1
          fi
          kubectl create configmap oficina-config \
            --namespace "$TARGET_NS" \
            --from-literal=DB_URL="$APP_DB_URL" \
            --from-literal=DB_USER="$APP_DB_USER" \
            --from-literal=SERVER_PORT=8080 \
            --from-literal=SPRING_PROFILES_ACTIVE= \
            --from-literal=ADMIN_EMAIL=admin@oficina.local \
            --from-literal=NOTIFICACAO_TIPO=log \
            --from-literal=SERVERLESS_JWT_ISSUER="$SERVERLESS_JWT_ISSUER" \
            --from-literal=SERVERLESS_JWT_AUDIENCE="$SERVERLESS_JWT_AUDIENCE" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oficina-secrets \
            --namespace "$TARGET_NS" \
            --from-literal=DB_PASSWORD="$APP_DB_PASSWORD" \
            --from-literal=JWT_SECRET="$APP_JWT_SECRET" \
            --from-literal=ADMIN_PASSWORD="$APP_ADMIN_PASSWORD" \
            --from-literal=SERVERLESS_JWT_PUBLIC_KEY="$APP_SERVERLESS_JWT_PUBLIC_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply application manifests
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl apply -f rendered/app-deployment.yaml
          kubectl apply -f rendered/app-service.yaml
          kubectl apply -f rendered/hpa.yaml

      - name: Wait for application rollout
        if: steps.check.outputs.configured == 'true'
        run: kubectl rollout status deployment/oficina-app -n "${{ inputs.namespace }}" --timeout=180s

      - name: Smoke test
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl -n "${{ inputs.namespace }}" run smoke-${{ github.run_id }} \
            --image=curlimages/curl:8.10.1 --restart=Never --rm -i --quiet \
            --command -- curl -fsS http://oficina-app/actuator/health

      - name: Deployment summary
        if: steps.check.outputs.configured == 'true'
        run: |
          {
            echo "### Deploy em '${{ inputs.environment }}'"
            echo "- Namespace: \`${{ inputs.namespace }}\`"
            echo "- Imagem: \`${{ inputs.image_ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods,svc,hpa -n "${{ inputs.namespace }}"
